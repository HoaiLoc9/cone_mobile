<!DOCTYPE html><html><head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="COne - Hệ thống Quản lý Điểm rèn luyện sinh viên">

  <!-- iOS Viewport & Fullscreen Display chuẩn iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="COne">
  <meta name="theme-color" content="#F1F5F9">

  <!-- iOS Icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>COne</title>
  <link rel="manifest" href="manifest.json">

  <!-- Tối ưu hiệu năng cảm ứng & cuộn mượt 60-120fps trên iOS -->
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #F1F5F9;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #FFFFFF;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }

    // Đăng ký Service Worker ngay khi trang tải để sẵn sàng nhận Push Notifications
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js', { scope: './' })
          .then(function(reg) {
            console.log('COne Service Worker registered:', reg.scope);
          })
          .catch(function(err) {
            console.warn('COne Service Worker registration error:', err);
          });
      });
    }

    // Hỗ trợ Web Push Notification trên iOS Safari PWA & Desktop
    window.requestWebNotificationPermission = async function() {
      if (!('Notification' in window)) {
        return 'unsupported';
      }
      try {
        if ('serviceWorker' in navigator) {
          try {
            await navigator.serviceWorker.register('sw.js', { scope: './' });
          } catch (_) {}
        }
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          setTimeout(function() {
            window.sendWebNotification('COne Thông Báo 🎉', 'Đã kích hoạt thông báo thành công cho thiết bị của bạn!');
          }, 300);
        }
        return permission;
      } catch (e) {
        console.error('Error requesting notification permission:', e);
        return 'denied';
      }
    };

    window.getWebNotificationStatus = function() {
      if (!('Notification' in window)) return 'unsupported';
      return Notification.permission;
    };

    window.sendWebNotification = async function(title, body) {
      if (!('Notification' in window)) return;
      if (Notification.permission !== 'granted') return;

      try {
        if ('serviceWorker' in navigator) {
          let reg = await navigator.serviceWorker.getRegistration();
          if (!reg) {
            reg = await navigator.serviceWorker.register('sw.js', { scope: './' });
          }

          if (reg) {
            await reg.showNotification(title || 'COne Thông Báo', {
              body: body || 'Bạn có thông báo mới!',
              icon: 'icons/Icon-192.png',
              badge: 'icons/Icon-192.png',
              vibrate: [200, 100, 200],
              tag: 'cone-tag-' + Date.now(),
              renotify: true
            });
            return;
          }
        }
      } catch (err) {
        console.warn('ServiceWorker showNotification error, attempting fallback:', err);
      }

      // Fallback cho trình duyệt Desktop
      try {
        new Notification(title || 'COne Thông Báo', {
          body: body || 'Bạn có thông báo mới!',
          icon: 'icons/Icon-192.png'
        });
      } catch (e) {
        console.warn('Standard Notification fallback error:', e);
      }
    };

    function urlB64ToUint8Array(base64String) {
      var padding = '='.repeat((4 - base64String.length % 4) % 4);
      var base64 = (base64String + padding)
        .replace(/\-/g, '+')
        .replace(/_/g, '/');
      var rawData = window.atob(base64);
      var outputArray = new Uint8Array(rawData.length);
      for (var i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    // Đăng ký Push Subscription với Apple APNs / Google FCM (WebPush VAPID)
    window.subscribeWebPush = async function(vapidPublicKey) {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        return JSON.stringify({ error: 'unsupported' });
      }
      try {
        var reg = await navigator.serviceWorker.getRegistration();
        if (!reg) {
          reg = await navigator.serviceWorker.register('sw.js', { scope: './' });
        }
        await navigator.serviceWorker.ready;
        var sub = await reg.pushManager.getSubscription();
        if (!sub && vapidPublicKey) {
          var appServerKey = urlB64ToUint8Array(vapidPublicKey);
          sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: appServerKey
          });
        }
        if (sub) {
          return JSON.stringify(sub.toJSON());
        }
        return JSON.stringify({ error: 'no_subscription' });
      } catch (err) {
        console.error('subscribeWebPush error:', err);
        return JSON.stringify({ error: err.message || err.toString() });
      }
    };

    // Hỗ trợ Face ID / Touch ID / Vân tay qua chuẩn WebAuthn trên iPhone Safari PWA & Desktop
    window.isWebAuthnAvailable = async function() {
      try {
        if (window.PublicKeyCredential &&
            typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable === 'function') {
          return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        }
      } catch (e) {
        console.warn('isWebAuthnAvailable check error:', e);
      }
      return false;
    };

    window.authenticateWebBiometric = async function(reason) {
      try {
        if (!window.PublicKeyCredential) return false;

        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);

        const existingCredId = localStorage.getItem('cone_bio_cred_id');

        if (!existingCredId) {
          // Lần đầu đăng ký Face ID / Touch ID cho thiết bị
          const userId = new Uint8Array(16);
          window.crypto.getRandomValues(userId);

          const credential = await navigator.credentials.create({
            publicKey: {
              challenge: challenge,
              rp: { name: "COne Mobile", id: window.location.hostname },
              user: {
                id: userId,
                name: "sinhvien",
                displayName: "Sinh viên COne"
              },
              pubKeyCredParams: [
                { alg: -7, type: "public-key" },
                { alg: -257, type: "public-key" }
              ],
              authenticatorSelection: {
                authenticatorAttachment: "platform",
                userVerification: "required"
              },
              timeout: 60000
            }
          });

          if (credential) {
            const rawId = Array.from(new Uint8Array(credential.rawId)).map(b => String.fromCharCode(b)).join('');
            localStorage.setItem('cone_bio_cred_id', btoa(rawId));
            return true;
          }
          return false;
        } else {
          // Xác thực các lần sau bằng Face ID / Touch ID đã lưu
          const rawIdStr = atob(existingCredId);
          const rawId = Uint8Array.from(rawIdStr, c => c.charCodeAt(0));

          const assertion = await navigator.credentials.get({
            publicKey: {
              challenge: challenge,
              rpId: window.location.hostname,
              allowCredentials: [{
                id: rawId,
                type: 'public-key'
              }],
              userVerification: "required",
              timeout: 60000
            }
          });

          return !!assertion;
        }
      } catch (err) {
        console.warn('WebAuthn biometric error or cancelled:', err);
        return false;
      }
    };

    // Tự động kiểm tra khi người dùng mở lại app / mở khóa màn hình iPhone
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        console.log('COne PWA resumed, ready for notifications.');
      }
    });
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>

      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
