<!DOCTYPE html><html><head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="COne - Hệ thống Quản lý Điểm rèn luyện sinh viên">

  <!-- iOS Viewport & Fullscreen Display chuẩn iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="COne">
  <meta name="theme-color" content="#F1F5F9">

  <!-- iOS Icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>COne</title>
  <link rel="manifest" href="manifest.json">

  <!-- Tối ưu hiệu năng cảm ứng & cuộn mượt 60-120fps trên iOS -->
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #F1F5F9;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #FFFFFF;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }

    // Hỗ trợ Web Push Notification trên iOS Safari PWA & Desktop
    window.requestWebNotificationPermission = async function() {
      if (!('Notification' in window)) {
        return 'unsupported';
      }
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          try {
            if ('serviceWorker' in navigator && navigator.serviceWorker.ready) {
              const reg = await navigator.serviceWorker.ready;
              reg.showNotification('COne Thông Báo', {
                body: 'Đã kích hoạt thông báo thành công trên iPhone của bạn! 🎉',
                icon: 'icons/Icon-192.png',
                badge: 'icons/Icon-192.png'
              });
            } else {
              new Notification('COne Thông Báo', {
                body: 'Đã kích hoạt thông báo thành công trên iPhone của bạn! 🎉',
                icon: 'icons/Icon-192.png'
              });
            }
          } catch (e) {
            console.log('Notification trigger note:', e);
          }
        }
        return permission;
      } catch (e) {
        console.error('Error requesting notification permission:', e);
        return 'denied';
      }
    };

    window.getWebNotificationStatus = function() {
      if (!('Notification' in window)) return 'unsupported';
      return Notification.permission;
    };
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
